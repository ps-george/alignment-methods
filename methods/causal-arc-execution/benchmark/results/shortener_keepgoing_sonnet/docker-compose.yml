version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - url_data:/data
    environment:
      - DB_PATH=/data/urls.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  url_data:
