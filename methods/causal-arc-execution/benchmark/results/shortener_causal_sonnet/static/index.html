<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
    p.tagline { color: #666; margin-bottom: 2.5rem; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      margin-bottom: 1.5rem;
    }

    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: #6366f1; }

    button {
      padding: 0.65rem 1.2rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #4f46e5; }
    button:disabled { background: #a5b4fc; cursor: default; }

    .result {
      margin-top: 1rem;
      padding: 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .result.success { background: #f0fdf4; border: 1px solid #86efac; }
    .result.error   { background: #fef2f2; border: 1px solid #fca5a5; }
    .result a { color: #6366f1; text-decoration: none; font-weight: 500; }
    .result a:hover { text-decoration: underline; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; font-size: 0.9rem; }
    td { padding: 0.45rem 0.25rem; vertical-align: top; }
    td:first-child { font-weight: 600; color: #555; width: 110px; }
    .long-url { word-break: break-all; }

    footer { color: #aaa; font-size: 0.8rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <p class="tagline">Paste a long URL, get a short one.</p>

  <!-- Shorten card -->
  <div class="card">
    <h2>Shorten a URL</h2>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/very/long/path" />
      <button id="shortenBtn" onclick="shortenUrl()">Shorten</button>
    </div>
    <div class="result" id="shortenResult"></div>
  </div>

  <!-- Stats card -->
  <div class="card">
    <h2>Check Stats</h2>
    <div class="input-row">
      <input type="text" id="codeInput" placeholder="Enter short code (e.g. a3f9b12)" />
      <button id="statsBtn" onclick="checkStats()">Stats</button>
    </div>
    <div class="result" id="statsResult"></div>
  </div>

  <footer>URL Shortener &mdash; built with FastAPI</footer>

  <script>
    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const btn   = document.getElementById('shortenBtn');
      const result = document.getElementById('shortenResult');
      const url = input.value.trim();

      if (!url) { showResult(result, 'error', 'Please enter a URL.'); return; }

      btn.disabled = true;
      result.style.display = 'none';

      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          const msg = extractError(data);
          showResult(result, 'error', msg);
        } else {
          showResult(result, 'success',
            `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a><br/>` +
            `Code: <strong>${data.code}</strong>`
          );
          // Pre-fill the stats code field
          document.getElementById('codeInput').value = data.code;
        }
      } catch (e) {
        showResult(result, 'error', 'Network error — please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    async function checkStats() {
      const input = document.getElementById('codeInput');
      const btn   = document.getElementById('statsBtn');
      const result = document.getElementById('statsResult');
      const code = input.value.trim();

      if (!code) { showResult(result, 'error', 'Please enter a short code.'); return; }

      btn.disabled = true;
      result.style.display = 'none';

      try {
        const res = await fetch(`/api/stats/${encodeURIComponent(code)}`);
        const data = await res.json();

        if (!res.ok) {
          showResult(result, 'error', extractError(data));
        } else {
          showResult(result, 'success',
            `<table>
              <tr><td>Code</td><td>${data.code}</td></tr>
              <tr><td>Clicks</td><td>${data.click_count}</td></tr>
              <tr><td>Original URL</td><td class="long-url"><a href="${data.original_url}" target="_blank">${data.original_url}</a></td></tr>
            </table>`
          );
        }
      } catch (e) {
        showResult(result, 'error', 'Network error — please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    function showResult(el, type, html) {
      el.className = `result ${type}`;
      el.innerHTML = html;
      el.style.display = 'block';
    }

    function extractError(data) {
      // FastAPI validation errors have a `detail` array
      if (Array.isArray(data.detail)) {
        return data.detail.map(e => e.msg).join('; ');
      }
      return data.error || data.detail || 'An unexpected error occurred.';
    }

    // Allow Enter key in inputs
    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });
    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkStats();
    });
  </script>
</body>
</html>
