services:
  shortener:
    build: .
    image: shortener:local
    container_name: shortener
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      SHORTENER_DB_PATH: /data/shortener.db
    volumes:
      - shortener-data:/data
    restart: unless-stopped

volumes:
  shortener-data:
