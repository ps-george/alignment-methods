<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>URL Shortener</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { margin-bottom: 0.25rem; }
    section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem 1.25rem;
              margin: 1.25rem 0; }
    input[type=url], input[type=text] { width: 100%; padding: 0.5rem;
                                        box-sizing: border-box; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer;
             margin-top: 0.5rem; }
    .result { margin-top: 0.75rem; padding: 0.5rem; background: #f5f5f5;
              border-radius: 4px; word-break: break-all; }
    .error { color: #b00020; }
    a { color: inherit; }
    @media (prefers-color-scheme: dark) {
      .result { background: #222; }
      section { border-color: #444; }
    }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <p>Shorten a URL, then look up its click stats.</p>

  <section>
    <h2>Shorten</h2>
    <form id="shorten-form">
      <label for="url">URL to shorten</label>
      <input id="url" name="url" type="url" required placeholder="https://example.com/some/long/path" />
      <button type="submit">Shorten</button>
    </form>
    <div id="shorten-result" class="result" hidden></div>
  </section>

  <section>
    <h2>Stats</h2>
    <form id="stats-form">
      <label for="code">Short code</label>
      <input id="code" name="code" type="text" required placeholder="abc1234" />
      <button type="submit">Look up</button>
    </form>
    <div id="stats-result" class="result" hidden></div>
  </section>

<script>
  const shortenForm = document.getElementById('shorten-form');
  const shortenResult = document.getElementById('shorten-result');
  const statsForm = document.getElementById('stats-form');
  const statsResult = document.getElementById('stats-result');

  function show(el, html, isError) {
    el.hidden = false;
    el.innerHTML = html;
    el.classList.toggle('error', !!isError);
  }

  shortenForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = document.getElementById('url').value;
    try {
      const r = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await r.json();
      if (!r.ok) {
        const msg = (data.error && data.error.message) || 'Error';
        show(shortenResult, 'Error: ' + msg, true);
        return;
      }
      show(shortenResult,
        'Short URL: <a href="' + data.short_url + '" target="_blank">' +
        data.short_url + '</a><br>Code: <strong>' + data.code + '</strong>',
        false);
    } catch (err) {
      show(shortenResult, 'Network error: ' + err.message, true);
    }
  });

  statsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('code').value.trim();
    try {
      const r = await fetch('/api/stats/' + encodeURIComponent(code));
      const data = await r.json();
      if (!r.ok) {
        const msg = (data.error && data.error.message) || 'Error';
        show(statsResult, 'Error: ' + msg, true);
        return;
      }
      show(statsResult,
        'Original URL: <a href="' + data.original_url + '" target="_blank">' +
          data.original_url + '</a><br>' +
        'Clicks: <strong>' + data.clicks + '</strong><br>' +
        'Created: ' + data.created_at,
        false);
    } catch (err) {
      show(statsResult, 'Network error: ' + err.message, true);
    }
  });
</script>
</body>
</html>
