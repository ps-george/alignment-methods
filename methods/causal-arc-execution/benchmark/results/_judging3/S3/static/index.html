<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #0f3460;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.75rem;
    }

    .section {
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"], input[type="url"] {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover { background: #2563eb; }
    button:active { background: #1d4ed8; }

    .result-box {
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .result-box.success {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
    }

    .result-box.error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .result-box a {
      color: #1d4ed8;
      word-break: break-all;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.85rem;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #94a3b8;
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      word-break: break-all;
    }

    .stat-value.big {
      font-size: 1.5rem;
      color: #3b82f6;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 2rem 0;
    }

    .copy-btn {
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
      background: #e5e7eb;
      color: #374151;
      border-radius: 6px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .copy-btn:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <div class="container">
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short, shareable link.</p>

    <div class="section">
      <h2>Shorten a URL</h2>
      <div class="input-row">
        <input type="url" id="urlInput" placeholder="https://example.com/very/long/path" />
        <button onclick="shortenUrl()">Shorten</button>
      </div>
      <div class="result-box" id="shortenResult"></div>
    </div>

    <hr class="divider" />

    <div class="section">
      <h2>View Stats</h2>
      <div class="input-row">
        <input type="text" id="codeInput" placeholder="Short code (e.g. aB3xYz)" />
        <button onclick="fetchStats()">Get Stats</button>
      </div>
      <div class="result-box" id="statsResult"></div>
    </div>
  </div>

  <script>
    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const resultBox = document.getElementById('shortenResult');
      const url = input.value.trim();

      if (!url) {
        showResult(resultBox, 'error', 'Please enter a URL.');
        return;
      }

      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          const msg = data.detail
            ? (Array.isArray(data.detail)
                ? data.detail.map(e => e.msg).join('; ')
                : data.detail)
            : 'Unknown error';
          showResult(resultBox, 'error', `Error: ${msg}`);
          return;
        }

        showResult(resultBox, 'success',
          `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a>
           <button class="copy-btn" onclick="copyText('${data.short_url}', this)">Copy</button>
           <br/><small style="color:#6b7280">Code: <strong>${data.code}</strong></small>`
        );
      } catch (err) {
        showResult(resultBox, 'error', `Request failed: ${err.message}`);
      }
    }

    async function fetchStats() {
      const input = document.getElementById('codeInput');
      const resultBox = document.getElementById('statsResult');
      const code = input.value.trim();

      if (!code) {
        showResult(resultBox, 'error', 'Please enter a short code.');
        return;
      }

      try {
        const res = await fetch(`/api/stats/${encodeURIComponent(code)}`);
        const data = await res.json();

        if (!res.ok) {
          showResult(resultBox, 'error', `Error: ${data.detail || 'Unknown error'}`);
          return;
        }

        resultBox.style.display = 'block';
        resultBox.className = 'result-box success';
        resultBox.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Short Code</div>
              <div class="stat-value">${escHtml(data.code)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Clicks</div>
              <div class="stat-value big">${data.click_count}</div>
            </div>
            <div class="stat-card" style="grid-column:1/-1">
              <div class="stat-label">Original URL</div>
              <div class="stat-value">
                <a href="${escHtml(data.original_url)}" target="_blank">${escHtml(data.original_url)}</a>
              </div>
            </div>
          </div>`;
      } catch (err) {
        showResult(resultBox, 'error', `Request failed: ${err.message}`);
      }
    }

    function showResult(box, type, html) {
      box.style.display = 'block';
      box.className = `result-box ${type}`;
      box.innerHTML = html;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }

    // Allow Enter key in inputs
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('urlInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') shortenUrl();
      });
      document.getElementById('codeInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') fetchStats();
      });
    });
  </script>
</body>
</html>
