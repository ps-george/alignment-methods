<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #718096;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.875rem;
      color: #4a5568;
      margin-bottom: 0.4rem;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.7rem;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #5a67d8; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }

    .result-box {
      margin-top: 1.25rem;
      padding: 1rem 1.2rem;
      border-radius: 8px;
      font-size: 0.92rem;
      display: none;
    }

    .result-box.success {
      background: #f0fff4;
      border: 1.5px solid #9ae6b4;
      color: #276749;
      display: block;
    }

    .result-box.error {
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      color: #c53030;
      display: block;
    }

    .result-box a {
      color: #3182ce;
      word-break: break-all;
    }

    .divider {
      margin: 2rem 0;
      border: none;
      border-top: 1.5px solid #e2e8f0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .stat-card {
      background: #f7fafc;
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }

    .stat-label {
      font-size: 0.78rem;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.05rem;
      color: #1a202c;
      font-weight: 700;
      margin-top: 0.2rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short link instantly.</p>

    <!-- Shorten Form -->
    <form id="shorten-form">
      <label for="url-input">Long URL</label>
      <input
        id="url-input"
        type="url"
        placeholder="https://example.com/very/long/path?query=value"
        required
        autocomplete="off"
      />
      <button type="submit" id="shorten-btn">Shorten URL</button>
    </form>

    <div id="shorten-result" class="result-box"></div>

    <hr class="divider" />

    <!-- Stats Form -->
    <form id="stats-form">
      <label for="code-input">Check Stats for Short Code</label>
      <input
        id="code-input"
        type="text"
        placeholder="e.g. a1b2c3d"
        autocomplete="off"
        required
      />
      <button type="submit" id="stats-btn">Get Stats</button>
    </form>

    <div id="stats-result" class="result-box"></div>
  </div>

  <script>
    const shortenForm = document.getElementById("shorten-form");
    const shortenResult = document.getElementById("shorten-result");
    const codeInput = document.getElementById("code-input");

    shortenForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("url-input").value.trim();
      const btn = document.getElementById("shorten-btn");
      btn.disabled = true;
      btn.textContent = "Shortening…";
      shortenResult.className = "result-box";
      shortenResult.innerHTML = "";

      try {
        const res = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || data.detail || "Unknown error");
        }

        shortenResult.className = "result-box success";
        shortenResult.innerHTML = `
          <strong>Short URL:</strong><br/>
          <a href="${data.short_url}" target="_blank" rel="noopener">${data.short_url}</a>
          <br/><br/>
          <strong>Code:</strong> <code>${data.short_code}</code>
        `;
        codeInput.value = data.short_code;
      } catch (err) {
        shortenResult.className = "result-box error";
        shortenResult.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Shorten URL";
      }
    });

    document.getElementById("stats-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      const btn = document.getElementById("stats-btn");
      btn.disabled = true;
      btn.textContent = "Loading…";
      const statsResult = document.getElementById("stats-result");
      statsResult.className = "result-box";
      statsResult.innerHTML = "";

      try {
        const res = await fetch(`/api/stats/${encodeURIComponent(code)}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || data.detail || "Unknown error");
        }

        statsResult.className = "result-box success";
        statsResult.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Short Code</div>
              <div class="stat-value">${data.short_code}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Clicks</div>
              <div class="stat-value">${data.click_count}</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
              <div class="stat-label">Original URL</div>
              <div class="stat-value">
                <a href="${data.original_url}" target="_blank" rel="noopener">${data.original_url}</a>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        statsResult.className = "result-box error";
        statsResult.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Get Stats";
      }
    });
  </script>
</body>
</html>
