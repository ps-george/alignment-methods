<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>URL Shortener</h1>

    <section class="card">
      <h2>Shorten a URL</h2>
      <form id="shorten-form">
        <input type="url" id="url-input" name="url" placeholder="https://example.com/very/long/path" required />
        <button type="submit">Shorten</button>
      </form>
      <div id="shorten-result" class="result" hidden></div>
      <div id="shorten-error" class="error" hidden></div>
    </section>

    <section class="card">
      <h2>View stats</h2>
      <form id="stats-form">
        <input type="text" id="code-input" name="code" placeholder="abc1234" required />
        <button type="submit">Lookup</button>
      </form>
      <div id="stats-result" class="result" hidden></div>
      <div id="stats-error" class="error" hidden></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
