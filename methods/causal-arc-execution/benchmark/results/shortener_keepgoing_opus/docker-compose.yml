services:
  shortener:
    build: .
    image: shortener:latest
    container_name: shortener
    ports:
      - "8000:8000"
    environment:
      SHORTENER_DB_PATH: /data/shortener.db
      SHORTENER_BASE_URL: http://localhost:8000
    volumes:
      - shortener_data:/data
    restart: unless-stopped

volumes:
  shortener_data:
