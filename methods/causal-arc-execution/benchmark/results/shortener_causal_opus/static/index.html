<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { margin-bottom: 0.25rem; }
    .sub { color: #666; margin-bottom: 2rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type=text], input[type=url] { flex: 1; padding: 0.6rem; font-size: 1rem;
           border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 0.6rem 1rem; font-size: 1rem; border: 0; border-radius: 6px;
             background: #2563eb; color: white; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .card { padding: 1rem; border: 1px solid #ddd; border-radius: 8px;
            margin-top: 1rem; background: rgba(0,0,0,0.02); }
    .err { color: #b91c1c; }
    code { background: rgba(0,0,0,0.08); padding: 0.1rem 0.3rem; border-radius: 4px; }
    section { margin-top: 2.5rem; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <div class="sub">Paste a URL, get a short link. Look up stats by code.</div>

  <section>
    <h2>Shorten</h2>
    <form id="shorten-form">
      <input id="url-input" type="url" placeholder="https://example.com/very/long/path" required />
      <button type="submit">Shorten</button>
    </form>
    <div id="shorten-result"></div>
  </section>

  <section>
    <h2>Look up stats</h2>
    <form id="stats-form">
      <input id="code-input" type="text" placeholder="abc1234" required />
      <button type="submit">Get stats</button>
    </form>
    <div id="stats-result"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);

    function showError(el, msg) {
      el.innerHTML = `<div class="card err">${msg}</div>`;
    }

    $("shorten-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = $("url-input").value.trim();
      const out = $("shorten-result");
      out.innerHTML = "<div class='card'>Working…</div>";
      try {
        const r = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const j = await r.json();
        if (!r.ok) {
          showError(out, (j.error && j.error.message) || ("HTTP " + r.status));
          return;
        }
        out.innerHTML = `<div class="card">
          <div>Short URL: <a href="${j.short_url}" target="_blank">${j.short_url}</a></div>
          <div>Code: <code>${j.code}</code></div>
          <div>Original: ${j.url}</div>
        </div>`;
      } catch (err) {
        showError(out, err.message || String(err));
      }
    });

    $("stats-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = $("code-input").value.trim();
      const out = $("stats-result");
      out.innerHTML = "<div class='card'>Working…</div>";
      try {
        const r = await fetch("/api/stats/" + encodeURIComponent(code));
        const j = await r.json();
        if (!r.ok) {
          showError(out, (j.error && j.error.message) || ("HTTP " + r.status));
          return;
        }
        out.innerHTML = `<div class="card">
          <div>Code: <code>${j.code}</code></div>
          <div>Original URL: ${j.url}</div>
          <div>Clicks: <strong>${j.clicks}</strong></div>
          <div>Created: ${j.created_at}</div>
        </div>`;
      } catch (err) {
        showError(out, err.message || String(err));
      }
    });
  </script>
</body>
</html>
